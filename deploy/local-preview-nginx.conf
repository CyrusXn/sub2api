# 本地验收只加载本地构建的前端资源，业务 API 复用线上应用实例。
# 这样可以使用线上账号和数据，同时避免第二个后端实例直连线上数据库后启动迁移与后台任务。
server {
  listen 8080;

  # Colima 当前 Docker 内置 DNS 没有外部上游，线上域名需要显式使用公共 DNS 解析。
  resolver 223.5.5.5 119.29.29.29 ipv6=off valid=300s;
  set $production_backend api.xnkaixin.eu.cc;

  location ^~ /api/ {
    proxy_pass https://$production_backend;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.xnkaixin.eu.cc;
    proxy_set_header Host api.xnkaixin.eu.cc;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Sub2API-Preview-Backend production always;
  }

  location ^~ /v1/ {
    proxy_pass https://$production_backend;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.xnkaixin.eu.cc;
    proxy_set_header Host api.xnkaixin.eu.cc;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header X-Sub2API-Preview-Backend production always;
  }

  location / {
    proxy_pass http://sub2api-preview-app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
